    <circle cx="70" cy="110" r="4" fill="#334155"/>
    <circle cx="90" cy="110" r="4" fill="#07c160"/>
    <circle cx="110" cy="110" r="4" fill="#334155"/>
    <circle cx="80" cy="130" r="4" fill="#334155"/>
    <circle cx="100" cy="130" r="4" fill="#334155"/>
