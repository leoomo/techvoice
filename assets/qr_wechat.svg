    <rect x="15" y="125" width="40" height="40" rx="6" fill="#07c160"/>
    <rect x="23" y="133" width="24" height="24" rx="4" fill="#ffffff"/>
    <rect x="29" y="139" width="12" height="12" rx="2" fill="#07c160"/>

    <!-- Decorative matrix dots -->
    <circle cx="80" cy="25" r="4" fill="#334155"/>
    <circle cx="95" cy="25" r="4" fill="#334155"/>
    <circle cx="70" cy="40" r="4" fill="#334155"/>
    <circle cx="100" cy="40" r="4" fill="#334155"/>
    <circle cx="85" cy="55" r="4" fill="#07c160"/>
