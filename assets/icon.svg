<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="robotGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="16 8" opacity="0.4"/>
  <!-- Headphone Arc -->
  <path d="M 140 256 A 116 116 0 0 1 372 256" fill="none" stroke="#38bdf8" stroke-width="24" stroke-linecap="round"/>
  <!-- Ear Cups -->
  <rect x="120" y="240" width="36" height="70" rx="18" fill="url(#robotGlow)"/>
  <rect x="356" y="240" width="36" height="70" rx="18" fill="url(#robotGlow)"/>
  <!-- Robot Face -->
  <rect x="176" y="190" width="160" height="130" rx="30" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
  <!-- Robot Antenna -->
  <line x1="256" y1="190" x2="256" y2="150" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="140" r="14" fill="#38bdf8"/>
  <!-- Eyes -->
  <circle cx="216" cy="245" r="18" fill="#38bdf8"/>
  <circle cx="296" cy="245" r="18" fill="#38bdf8"/>
  <!-- Sound Waves in Mouth -->
  <path d="M 216 285 Q 256 305 296 285" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
</svg>
